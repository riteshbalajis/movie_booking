<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - CineBook</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
    <div class="form-narrow card">
        <h1 class="mt-0">Sign in</h1>
        <p class="subtitle muted">Welcome back.</p>

        <div id="message" class="message"></div>

        <form id="login-form">
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button class="btn btn-block" type="submit" id="submit">Sign in</button>
        </form>

        <p class="small muted mt-2 center">
            No account yet? <a href="/register.html">Create one</a>
        </p>

        <p class="small muted center">
            Demo administrator: <span class="mono">admin@movie.com / Admin@123</span>
        </p>
    </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
(async function () {
    await App.renderHeader('sign in');

    const form = document.getElementById('login-form');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        App.clearMessage('message');
        submit.disabled = true;
        submit.textContent = 'Signing in...';

        try {
            await Api.login(
                document.getElementById('email').value.trim(),
                document.getElementById('password').value);

            // Return the user to whatever they were trying to reach, but only
            // if it is a path on this site - blindly following a ?next= value
            // would turn this page into an open redirect that phishers could
            // point at their own domain.
            const next = App.param('next');
            const safeNext = next && next.startsWith('/') && !next.startsWith('//')
                ? next : '/index.html';
            window.location.href = safeNext;

        } catch (error) {
            App.showMessage('message', error.message, 'error');
            submit.disabled = false;
            submit.textContent = 'Sign in';
        }
    });
})();
</script>

</body>
</html>
